<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="page_title">媒體批次轉換工具</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --border: #dcdfe4; --text: #1c1f24;
    --muted: #6b7280; --accent: #2563eb; --accent-hover: #1d4ed8;
    --danger: #dc2626; --ok: #16a34a; --drop-bg: #eef2ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171b; --panel: #1d2025; --border: #33373f; --text: #e8eaed;
      --muted: #9aa0aa; --accent: #3b82f6; --accent-hover: #60a5fa;
      --danger: #f87171; --ok: #4ade80; --drop-bg: #1e2540;
    }
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif; margin: 0; padding: 24px; }
  .wrap { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 12px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .row:last-child { margin-bottom: 0; }
  label { font-size: 13px; }
  select, input[type=text], input[type=number] { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 13px; }
  button { cursor: pointer; border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 6px; padding: 7px 14px; font-size: 13px; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: var(--accent-hover); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .toggle-group button { border-radius: 0; }
  .toggle-group button:first-child { border-radius: 6px 0 0 6px; }
  .toggle-group button:last-child { border-radius: 0 6px 6px 0; }
  .toggle-group button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  #dropzone { border: 2px dashed var(--border); border-radius: 10px; padding: 28px 16px; text-align: center; color: var(--muted); font-size: 13px; cursor: pointer; transition: .15s; }
  #dropzone.drag { border-color: var(--accent); background: var(--drop-bg); color: var(--accent); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  .status-pending { color: var(--muted); }
  .status-working { color: var(--accent); }
  .status-done { color: var(--ok); }
  .status-error { color: var(--danger); }
  .file-name { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  progress { width: 100%; height: 8px; accent-color: var(--accent); }
  #log { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; height: 140px; overflow-y: auto; white-space: pre-wrap; }
  .notice { font-size: 12px; color: var(--muted); background: var(--drop-bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 16px; }
  .hidden { display: none !important; }
  .actions { display: flex; gap: 8px; align-items: center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="row" style="justify-content: space-between; align-items: flex-start;">
    <div>
      <h1 data-i18n="page_title">媒體批次轉換工具</h1>
      <div class="sub" data-i18n="page_sub">在瀏覽器內批次轉換影片與圖片格式，檔案不會上傳到任何伺服器</div>
    </div>
    <select id="langSelect">
      <option value="zh-Hant">繁體中文</option>
      <option value="zh-Hans">简体中文</option>
      <option value="en">English</option>
    </select>
  </div>

  <div class="notice" data-i18n="notice_serve_http">
    注意：由於瀏覽器安全限制，此頁面需要透過 http(s) 伺服器開啟（例如執行 <code>python3 -m http.server</code> 後用 http://localhost:8000 開啟），直接雙擊開啟 index.html（file://）可能無法載入影片轉換引擎。
  </div>

  <div class="card">
    <h2 data-i18n="section_type">轉換類型</h2>
    <div class="row">
      <div class="toggle-group">
        <button id="modeVideoBtn" class="active" data-i18n="type_video">影片</button><button id="modeImageBtn" data-i18n="type_image">圖片</button>
      </div>
      <label data-i18n="target_format_label">目標格式：</label>
      <select id="targetFormat"></select>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="section_source">來源檔案 / 資料夾</h2>
    <div id="dropzone">
      <div data-i18n="drop_hint">將檔案或資料夾拖放到這裡，或點擊選擇</div>
    </div>
    <input type="file" id="fileInput" multiple class="hidden">
    <input type="file" id="folderInput" webkitdirectory multiple class="hidden">
    <div class="row" style="margin-top: 10px;">
      <button id="chooseFilesBtn" data-i18n="btn_choose_files">選擇多個檔案...</button>
      <button id="chooseFolderBtn" data-i18n="btn_choose_folder">選擇整個資料夾...</button>
      <button id="clearBtn" data-i18n="btn_clear">清空清單</button>
      <span id="fileCount" style="margin-left:auto; color: var(--muted); font-size: 13px;" data-i18n="no_files_selected">尚未選擇檔案</span>
    </div>
    <table id="fileTable" style="display:none;">
      <thead><tr>
        <th data-i18n="col_file">檔案</th><th data-i18n="col_status">狀態</th><th data-i18n="col_result">結果</th>
      </tr></thead>
      <tbody id="fileTableBody"></tbody>
    </table>
  </div>

  <div class="card" id="videoParams">
    <h2 data-i18n="section_params">轉檔參數</h2>
    <div class="row">
      <label data-i18n="quality_label">畫質 (0-100，越大越好):</label>
      <input type="number" id="videoQuality" min="0" max="100" value="60" style="width:64px;">
      <label data-i18n="speed_label">編碼速度 (0=最慢最好, 5=最快):</label>
      <input type="number" id="videoSpeed" min="0" max="5" value="2" style="width:56px;">
      <label data-i18n="audio_bitrate_label">音訊位元率:</label>
      <input type="text" id="audioBitrate" value="96k" style="width:64px;">
    </div>
  </div>

  <div class="card hidden" id="imageParams">
    <h2 data-i18n="section_params">轉檔參數</h2>
    <div class="row">
      <label data-i18n="quality_label">畫質 (0-100，越大越好):</label>
      <input type="number" id="imageQuality" min="1" max="100" value="82" style="width:64px;">
      <label data-i18n="max_width_label">最大寬度(px，留空=不限制):</label>
      <input type="text" id="maxWidth" style="width:80px;">
      <label><input type="checkbox" id="lossless"> <span data-i18n="lossless_label">無損壓縮 (檔案較大，僅 WebP 支援)</span></label>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <button id="startBtn" class="primary" data-i18n="btn_start">開始批次轉換</button>
      <button id="downloadZipBtn" disabled data-i18n="btn_download_zip">下載全部 (ZIP)</button>
      <span id="progressLabel" style="color: var(--muted); font-size: 13px;"></span>
    </div>
    <progress id="progressBar" value="0" max="1" style="margin-top:8px;"></progress>
  </div>

  <div class="card">
    <h2 data-i18n="section_log">紀錄</h2>
    <div id="log"></div>
  </div>
</div>

<script type="module">

    btn_choose_files: "Choose Files...", btn_choose_folder: "Choose Folder...", btn_clear: "Clear List",
    no_files_selected: "No files selected", files_selected: "{n} file(s) selected",
    col_file: "File", col_status: "Status", col_result: "Result",
    section_params: "Conversion Settings", quality_label: "Quality (0-100, higher = better):", speed_label: "Encoding speed (0=slowest/best, 5=fastest):",
    audio_bitrate_label: "Audio bitrate:", max_width_label: "Max width (px, blank = no limit):", lossless_label: "Lossless (larger file, WebP only)",

    section_log: "Log", warn_no_files: "Please choose files or a folder to convert first.",
    status_pending: "Pending", status_working: "Working", status_done: "Done", status_error: "Failed",
    log_loading_ffmpeg: "Loading ffmpeg.wasm engine (first use downloads ~30MB, please wait)...",
    log_ffmpeg_ready: "ffmpeg.wasm ready.",

    log_same_format: "Source and target format are the same, skipped: {name}",
    log_done: "    Done -> {name}", log_failed: "    Failed: {name} ({err})",

let lang = localStorage.getItem("neon_lang") || "zh-Hant";
function t(key, params = {}) {
  let s = (STRINGS[lang] && STRINGS[lang][key]) ?? key;
  for (const [k, v] of Object.entries(params)) s = s.replace(`{${k}}`, v);
  return s;
}
function applyTranslations() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    el.innerHTML = t(key);
  });
  fileCountEl.textContent = files.length ? t("files_selected", { n: files.length }) : t("no_files_selected");
  buildFormatOptions();
}
document.getElementById("langSelect").value = lang;
document.getElementById("langSelect").addEventListener("change", e => {
  lang = e.target.value;
  localStorage.setItem("neon_lang", lang);
  applyTranslations();
});

// ---------------- state ----------------
let mode = "video"; // 'video' | 'image'
let files = []; // { file, path, status, resultBlob, resultName, error }
let ff = null;
let ffLoading = null;

const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("fileInput");
const folderInput = document.getElementById("folderInput");
const fileCountEl = document.getElementById("fileCount");
const fileTable = document.getElementById("fileTable");
const fileTableBody = document.getElementById("fileTableBody");
const targetFormatEl = document.getElementById("targetFormat");
const startBtn = document.getElementById("startBtn");
const downloadZipBtn = document.getElementById("downloadZipBtn");
const progressBar = document.getElementById("progressBar");
const progressLabel = document.getElementById("progressLabel");
const logEl = document.getElementById("log");

function log(msg) {
  logEl.textContent += msg + "\n";
  logEl.scrollTop = logEl.scrollHeight;
}

function buildFormatOptions() {
  const exts = mode === "video" ? VIDEO_EXTS : ["jpg", "png", "webp"];
  const prev = targetFormatEl.value;
  targetFormatEl.innerHTML = exts.map(e => `<option value="${e}">${e}</option>`).join("");
  targetFormatEl.value = exts.includes(prev) ? prev : (mode === "video" ? "webm" : "webp");
}

document.getElementById("modeVideoBtn").addEventListener("click", () => setMode("video"));
document.getElementById("modeImageBtn").addEventListener("click", () => setMode("image"));
function setMode(m) {
  mode = m;
  document.getElementById("modeVideoBtn").classList.toggle("active", m === "video");
  document.getElementById("modeImageBtn").classList.toggle("active", m === "image");
  document.getElementById("videoParams").classList.toggle("hidden", m !== "video");
  document.getElementById("imageParams").classList.toggle("hidden", m !== "image");
  buildFormatOptions();
  const exts = m === "video" ? VIDEO_EXTS : IMAGE_EXTS;
  files = files.filter(f => exts.includes(extOf(f.file.name)));
  renderFileList();
}

function extOf(name) {
  const e = name.split(".").pop().toLowerCase();
  return e === "jpeg" ? "jpg" : e;
}

function addFiles(newFiles) {
  const exts = mode === "video" ? VIDEO_EXTS : IMAGE_EXTS;
  for (const file of newFiles) {
    const ext = extOf(file.name);
    if (exts.includes(ext) && !files.some(f => f.file.name === file.name && f.file.size === file.size)) {
      files.push({ file, status: "pending", resultBlob: null, resultName: null, error: null });
    }
  }
  renderFileList();
}

function renderFileList() {
  fileCountEl.textContent = files.length ? t("files_selected", { n: files.length }) : t("no_files_selected");
  fileTable.style.display = files.length ? "table" : "none";
  fileTableBody.innerHTML = "";
  files.forEach((f, idx) => {
    const tr = document.createElement("tr");
    const statusClass = { pending: "status-pending", working: "status-working", done: "status-done", error: "status-error" }[f.status];
    let resultCell = "";
    if (f.status === "done") {
      resultCell = `<a href="#" data-idx="${idx}" class="dl-link">${t("download")}</a>`;
    } else if (f.status === "error") {
      resultCell = f.error || "";
    }
    tr.innerHTML = `<td class="file-name" title="${f.file.name}">${f.file.name}</td>
      <td class="${statusClass}">${t("status_" + f.status)}</td>
      <td>${resultCell}</td>`;
    fileTableBody.appendChild(tr);
  });
  fileTableBody.querySelectorAll(".dl-link").forEach(a => {
    a.addEventListener("click", e => {
      e.preventDefault();
      const f = files[+a.dataset.idx];
      downloadBlob(f.resultBlob, f.resultName);
    });
  });
}

function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

// ---- file/folder pickers ----
document.getElementById("chooseFilesBtn").addEventListener("click", () => fileInput.click());
document.getElementById("chooseFolderBtn").addEventListener("click", () => folderInput.click());
document.getElementById("clearBtn").addEventListener("click", () => { files = []; renderFileList(); });
fileInput.addEventListener("change", e => { addFiles([...e.target.files]); fileInput.value = ""; });
folderInput.addEventListener("change", e => { addFiles([...e.target.files]); folderInput.value = ""; });
dropzone.addEventListener("click", () => fileInput.click());

["dragenter", "dragover"].forEach(evt =>
  dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.add("drag"); }));
["dragleave", "drop"].forEach(evt =>
  dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.remove("drag"); }));

dropzone.addEventListener("drop", async e => {
  const items = e.dataTransfer.items;
  const collected = [];
  const entries = [...items].map(it => it.webkitGetAsEntry()).filter(Boolean);
  await Promise.all(entries.map(entry => traverseEntry(entry, collected)));
  addFiles(collected);
});

function traverseEntry(entry, out) {
  return new Promise(resolve => {
    if (entry.isFile) {
      entry.file(file => { out.push(file); resolve(); }, resolve);
    } else if (entry.isDirectory) {
      const reader = entry.createReader();
      const readBatch = () => {
        reader.readEntries(async entries => {
          if (!entries.length) return resolve();
          await Promise.all(entries.map(en => traverseEntry(en, out)));
          readBatch();
        }, resolve);
      };
      readBatch();
    } else resolve();
  });
}

// ---------------- conversion ----------------
async function getFFmpeg() {
  if (ff) return ff;
  if (ffLoading) return ffLoading;
  ffLoading = (async () => {
    log(t("log_loading_ffmpeg"));
    const instance = new FFmpeg();
    instance.on("log", ({ message }) => log("  ffmpeg: " + message));
    await instance.load({
      coreURL: `${FFMPEG_CORE_BASE}/ffmpeg-core.js`,
      wasmURL: `${FFMPEG_CORE_BASE}/ffmpeg-core.wasm`,
    });
    log(t("log_ffmpeg_ready"));
    ff = instance;
    return instance;
  })();
  return ffLoading;
}

function buildFfmpegArgs(inName, outName, targetExt, quality, speedIndex, audioBitrate) {
  const preset = VIDEO_PRESETS[targetExt] || VIDEO_PRESETS.mp4;
  const args = ["-i", inName, "-c:v", preset.vcodec];
  if (preset.crfMax) {
    const crf = Math.round((100 - quality) / 100 * preset.crfMax);
    args.push("-crf", String(crf));
    if (preset.vcodec === "libvpx-vp9") args.push("-b:v", "0", "-row-mt", "1");
  } else if (preset.qscaleMax) {
    const q = Math.max(1, Math.round((100 - quality) / 100 * preset.qscaleMax));
    args.push("-q:v", String(q));
  }
  if (preset.speedParam === "preset") {
    args.push("-preset", preset.speedValues[Math.min(speedIndex, preset.speedValues.length - 1)]);
  } else if (preset.speedParam === "speed") {
    args.push("-speed", preset.speedValues[Math.min(speedIndex, preset.speedValues.length - 1)]);
  }
  args.push("-c:a", preset.acodec, "-b:a", audioBitrate, outName);
  return args;
}

async function convertVideoFile(entry, targetExt) {
  const instance = await getFFmpeg();
  const srcExt = extOf(entry.file.name);
  const inName = "input." + srcExt;
  const outName = "output." + targetExt;
  await instance.writeFile(inName, await fetchFile(entry.file));
  const quality = +document.getElementById("videoQuality").value;
  const speed = +document.getElementById("videoSpeed").value;
  const bitrate = document.getElementById("audioBitrate").value || "96k";
  const args = buildFfmpegArgs(inName, outName, targetExt, quality, speed, bitrate);
  await instance.exec(args);
  const data = await instance.readFile(outName);
  await instance.deleteFile(inName).catch(() => {});
  await instance.deleteFile(outName).catch(() => {});
  return new Blob([data.buffer], { type: MIME[targetExt] || "application/octet-stream" });
}

async function convertImageFile(entry, targetExt) {
  const bitmap = await createImageBitmap(entry.file);
  let { width, height } = bitmap;
  const maxWidth = parseInt(document.getElementById("maxWidth").value, 10);
  if (maxWidth && width > maxWidth) {
    height = Math.max(1, Math.round(height * (maxWidth / width)));
    width = maxWidth;
  }
  const canvas = document.createElement("canvas");
  canvas.width = width; canvas.height = height;
  const ctx = canvas.getContext("2d");
  if (targetExt === "jpg") { ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, width, height); }
  ctx.drawImage(bitmap, 0, 0, width, height);
  const quality = +document.getElementById("imageQuality").value / 100;
  const lossless = document.getElementById("lossless").checked;
  const mime = MIME[targetExt];
  const q = (targetExt === "webp" && lossless) ? 1 : quality;
  return new Promise(resolve => canvas.toBlob(b => resolve(b), mime, q));
}

startBtn.addEventListener("click", async () => {
  if (!files.length) { alert(t("warn_no_files")); return; }
  startBtn.disabled = true;
  downloadZipBtn.disabled = true;
  const targetExt = targetFormatEl.value;
  progressBar.value = 0; progressBar.max = files.length;
  let ok = 0, fail = 0;
  const n = files.length;
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    const srcExt = extOf(f.file.name);
    if (srcExt === targetExt) {
      log(t("log_same_format", { name: f.file.name }));
      f.status = "done"; f.resultBlob = f.file; f.resultName = f.file.name;
      ok++; progressBar.value = i + 1; renderFileList();
      continue;
    }
    f.status = "working"; renderFileList();
    log(t("log_converting", { i: i + 1, n, name: f.file.name }));
    try {
      const blob = mode === "video"
        ? await convertVideoFile(f, targetExt)
        : await convertImageFile(f, targetExt);
      f.status = "done";
      f.resultBlob = blob;
      f.resultName = f.file.name.replace(/\.[^.]+$/, "") + "." + targetExt;
      log(t("log_done", { name: f.resultName }));
      ok++;
    } catch (err) {
      f.status = "error";
      f.error = String(err && err.message ? err.message : err);
      log(t("log_failed", { name: f.file.name, err: f.error }));
      fail++;
    }
    progressBar.value = i + 1;
    progressLabel.textContent = `${i + 1}/${n}`;
    renderFileList();
  }
  log(t("log_batch_done", { ok, fail }));
  startBtn.disabled = false;
  downloadZipBtn.disabled = !files.some(f => f.status === "done");
});

downloadZipBtn.addEventListener("click", async () => {
  const zip = new JSZip();
  files.filter(f => f.status === "done").forEach(f => zip.file(f.resultName, f.resultBlob));
  const blob = await zip.generateAsync({ type: "blob" });
  downloadBlob(blob, "converted.zip");
});

buildFormatOptions();
applyTranslations();
